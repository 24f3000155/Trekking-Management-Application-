{% extends 'admin_base.html' %}

{% block title %}Add Staff Member{% endblock %}

{% block content %}
<div class="d-flex align-items-center mb-4">
    <a href="{{ url_for('admin.staff_list') }}" class="btn btn-outline-secondary btn-sm me-3"><i class="bi bi-arrow-left"></i></a>
    <h1 class="section-title mb-0"><i class="bi bi-person-plus me-2"></i>Add Staff Member</h1>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <div class="alert alert-info mb-4">
            <i class="bi bi-info-circle me-2"></i>Staff created here will be <strong>auto-approved</strong> and can log in immediately.
        </div>
        <form method="POST" action="{{ url_for('admin.staff_create') }}">
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="name" class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="name" name="name" required>
                </div>
                <div class="col-md-6">
                    <label for="email" class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>
                <div class="col-md-6">
                    <label for="phone" class="form-label fw-semibold">Phone</label>
                    <input type="text" class="form-control" id="phone" name="phone">
                </div>
                <div class="col-md-6">
                    <label for="password" class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
                    <input type="password" class="form-control" id="password" name="password" minlength="6" required>
                    <div class="form-text">Minimum 6 characters.</div>
                </div>
                <div class="col-md-4">
                    <label for="experience_years" class="form-label fw-semibold">Experience (years)</label>
                    <input type="number" class="form-control" id="experience_years" name="experience_years" min="0" value="0">
                </div>
                <div class="col-md-4">
                    <label for="specialization" class="form-label fw-semibold">Specialization</label>
                    <input type="text" class="form-control" id="specialization" name="specialization">
                </div>
                <div class="col-md-4">
                    <label for="certification" class="form-label fw-semibold">Certification</label>
                    <input type="text" class="form-control" id="certification" name="certification">
                </div>
                <div class="col-12">
                    <label for="bio" class="form-label fw-semibold">Bio</label>
                    <textarea class="form-control" id="bio" name="bio" rows="3"></textarea>
                </div>
            </div>
            <hr class="my-4">
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary"><i class="bi bi-person-plus me-1"></i>Create Staff</button>
                <a href="{{ url_for('admin.staff_list') }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
