{% extends 'base.html' %}

{% block content %}
<div class="row">
    <div class="col-md-12">
        <div class="card shadow-sm mt-4">
            <div class="card-body p-5 text-center">
                <h1 class="display-4 text-primary">Admin Dashboard</h1>
                <p class="lead mt-3">Welcome back, Admin {{ user.name }}!</p>
                <hr class="my-4">
                <p>This is the protected Admin area.</p>
                <div class="mt-4">
                    <a href="{{ url_for('admin.pending_staff') }}" class="btn btn-warning btn-lg mx-2">Manage Pending Staff</a>
                    <a href="{{ url_for('auth.logout') }}" class="btn btn-danger btn-lg mx-2">Logout</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
