{% extends "base.html" %}
{% block title %}Staff Registration{% endblock %}
{% block head %}
<style>
    body { background: transparent; padding-top: 0 !important; }
    .tm-navbar, .tm-footer { display: none !important; }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card auth-card-wide">
        <div class="auth-header" style="background: linear-gradient(135deg, #4a90e2 0%, #357abd 100%);">
            <div class="auth-icon">
                <i class="bi bi-shield-plus text-white"></i>
            </div>
            <h2>Join Our Trek Staff</h2>
            <p>Apply to become a guide, coordinator, or support staff</p>
        </div>
        <div class="auth-body">


            <form method="POST" action="{{ url_for('auth.staff_register') }}" data-loading="true">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <h5 class="mb-3 border-bottom pb-2">Account Information</h5>
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="name" name="name" placeholder="Full Name" required autofocus minlength="2" maxlength="50">
                            <label for="name">Full Name *</label>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-floating">
                            <input type="email" class="form-control" id="email" name="email" placeholder="Email" required maxlength="120">
                            <label for="email">Email Address *</label>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-floating">
                            <input type="tel" class="form-control" id="phone" name="phone" placeholder="Phone" pattern="^\+?[0-9\-\s]{10,15}$" title="Phone number should be 10-15 digits. Can start with +">
                            <label for="phone">Phone Number</label>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-floating">
                            <input type="password" class="form-control password-strength" id="password" name="password" placeholder="Password" required minlength="8">
                            <label for="password">Password *</label>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-floating">
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Confirm Password" required minlength="8">
                            <label for="confirm_password">Confirm Password *</label>
                        </div>
                    </div>
                </div>

                <h5 class="mb-3 border-bottom pb-2">Professional Profile</h5>
                <div class="row g-3 mb-4">
                    <div class="col-md-4">
                        <div class="form-floating">
                            <input type="number" class="form-control" id="experience_years" name="experience_years" placeholder="0" min="0" value="0">
                            <label for="experience_years">Experience (Years)</label>
                        </div>
                    </div>
                    <div class="col-md-8">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="specialization" name="specialization" placeholder="e.g. High Altitude Guide, Medic">
                            <label for="specialization">Specialization</label>
                        </div>
                    </div>
                    <div class="col-12">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="certification" name="certification" placeholder="Certifications">
                            <label for="certification">Certifications</label>
                        </div>
                    </div>
                    <div class="col-12">
                        <div class="form-floating">
                            <textarea class="form-control" id="bio" name="bio" placeholder="Bio" style="height: 100px"></textarea>
                            <label for="bio">Short Bio / Background</label>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100 mb-3 d-flex align-items-center justify-content-center gap-2">
                    <span class="btn-text">Submit Application</span>
                    <span class="btn-spinner spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                </button>
            </form>
        </div>
        <div class="auth-footer text-muted border-top pt-3">
            <p class="mb-0">Already have an account? <a href="{{ url_for('auth.login') }}" class="text-decoration-none fw-semibold">Login here</a></p>
        </div>
    </div>
</div>
{% endblock %}
