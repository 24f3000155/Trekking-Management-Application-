{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm mt-4">
            <div class="card-body p-5">
                <h2 class="text-center mb-4">Trek Staff Registration</h2>
                <p class="text-muted text-center mb-4">Staff accounts require Admin approval before accessing the dashboard.</p>
                
                <form method="POST" class="needs-validation" action="{{ url_for('auth.staff_register') }}" novalidate>
                    <h5 class="mb-3 border-bottom pb-2">Basic Info</h5>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="name" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="name" name="name" value="{{ name|default('') }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email" value="{{ email|default('') }}" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control password-strength" id="password" name="password" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="confirm_password" class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="phone" class="form-label">Phone</label>
                        <input type="tel" class="form-control phone-input" id="phone" name="phone" value="{{ phone|default('') }}">
                    </div>

                    <h5 class="mb-3 border-bottom pb-2">Professional Info</h5>
                    
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="experience_years" class="form-label">Experience (Years)</label>
                            <input type="number" class="form-control" id="experience_years" name="experience_years" value="{{ experience_years|default('0') }}" min="0">
                        </div>
                        <div class="col-md-8 mb-3">
                            <label for="specialization" class="form-label">Specialization</label>
                            <input type="text" class="form-control" id="specialization" name="specialization" value="{{ specialization|default('') }}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="certification" class="form-label">Certifications</label>
                        <input type="text" class="form-control" id="certification" name="certification" value="{{ certification|default('') }}">
                    </div>

                    <div class="mb-3">
                        <label for="emergency_contact" class="form-label">Emergency Contact Info</label>
                        <input type="text" class="form-control" id="emergency_contact" name="emergency_contact" value="{{ emergency_contact|default('') }}">
                    </div>
                    
                    <div class="mb-4">
                        <label for="bio" class="form-label">Bio</label>
                        <textarea class="form-control" id="bio" name="bio" rows="3">{{ bio|default('') }}</textarea>
                    </div>

                    <button type="submit" class="btn btn-warning w-100">Submit Staff Registration</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
