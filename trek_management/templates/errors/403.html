{% extends "base.html" %}
{% block title %}Forbidden{% endblock %}
{% block head %}
<style>
    body { background: var(--tm-body-bg); padding-top: 0 !important; }
    .tm-navbar, .tm-footer { display: none !important; }
</style>
{% endblock %}

{% block content %}
<div class="error-page">
    <div>
        <div class="error-code">403</div>
        <h1 class="error-title">Access Forbidden</h1>
        <p class="error-message">You don't have permission to access this resource. Your role does not grant you access.</p>
        <button onclick="window.history.back()" class="btn btn-secondary px-4 me-2">
            <i class="bi bi-arrow-left me-2"></i>Go Back
        </button>
        <a href="/" class="btn btn-primary px-4">
            <i class="bi bi-house me-2"></i>Go Home
        </a>
    </div>
</div>
{% endblock %}
